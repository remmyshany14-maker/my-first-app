name: Build Android APK
on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "index.html"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
concurrency:
  group: android-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Use Android SDK preinstalled on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle app HTML
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug
      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.1.5 >/dev/null 2>&1 || gh release create v1.1.5 --title "灵感日记 Android v1.1.5" --notes "修复 Android 系统返回键的应用内导航；写作页改为居中编辑器和可展开章节导航，移除专注写作模式。包含此前的跨设备云同步优化。此版本为调试签名 APK。"
          gh release upload v1.1.5 android/app/build/outputs/apk/debug/app-debug.apk#灵感日记-v1.1.5.apk --clobber
