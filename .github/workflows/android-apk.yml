name: Build Android APK
on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "index.html"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
concurrency:
  group: android-apk
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Keep the debug signing certificate stable across builds so future APKs
      # can update the installed app. The first successful v1.1.7 build seeds this cache.
      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lingganriji-debug-signing-v1
      - name: Use Android SDK preinstalled on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle app HTML
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Check app JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline app script found")
          Path("/tmp/lingganriji-check.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/lingganriji-check.js
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug
      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.1.7 >/dev/null 2>&1 || gh release create v1.1.7 --title "灵感日记 Android v1.1.7" --notes "修复网络较慢时本机界面按钮无法及时响应的问题；首页灵感/日记纵向大入口与导航顺序优化。此版本为调试签名 APK。"
          gh release upload v1.1.7 android/app/build/outputs/apk/debug/app-debug.apk#灵感日记-v1.1.7.apk --clobber
